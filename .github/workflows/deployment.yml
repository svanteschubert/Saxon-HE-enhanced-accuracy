name: Draft GitHub release on tagging

# Pushing a tag v<version> (the <version> of pom.xml, e.g. v13.0.1-BETA) builds the release,
# runs the release check, and creates a *draft* GitHub release with the files below.
# Review and publish the draft on GitHub yourself. Maven Central is not touched.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and run the release check (EN16931 validator on Saxon-HE 13.0 and on this fork)
      run: mvn -B -Prelease-check verify
    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
        if [ "$TAG" != "v$version" ]; then
          echo "Tag $TAG does not match the pom.xml version $version (expected v$version)."
          exit 1
        fi
        prerelease=
        case "$version" in *-alpha*|*-beta*|*-BETA*|*-rc*|*-SNAPSHOT) prerelease=--prerelease ;; esac
        cp target/release-check/report.html "target/Saxon-HE-accuracy-$version-release-check.html"
        cat > target/release-notes.md <<EOF
        Saxon-HE 13.0 with decimal arithmetic and commercial rounding ("Svanton").

        **This is a proof of concept.** Please test it and compare its results with your existing XSLT processor
        before any use in production. You use it at your own risk: it comes without warranty under the
        Mozilla Public License 2.0, see
        [Status](https://github.com/svanteschubert/Saxon-HE-enhanced-accuracy#status-a-proof-of-concept-released-as-beta)
        in the README.

        **Saxon-HE-accuracy-$version.zip** contains the standalone JAR, which needs nothing but Java 25 or newer:

        \`\`\`
        java -jar Saxon-HE-accuracy-$version-standalone.jar -s:input.xml -xsl:stylesheet.xsl -o:output.xml
        \`\`\`

        Maven users take \`com.schubert-consulting:Saxon-HE-accuracy:$version\` from Maven Central instead.

        **Saxon-HE-accuracy-$version-release-check.html** shows the verdicts of the official EN16931 validation
        XSLT on stock Saxon-HE 13.0 and on this release, created by \`mvn -Prelease-check verify\`.
        EOF
        gh release create "$TAG" --draft $prerelease --verify-tag \
          --title "Saxon-HE-accuracy $version" --notes-file target/release-notes.md \
          "target/Saxon-HE-accuracy-$version.zip" \
          "target/Saxon-HE-accuracy-$version-standalone.jar" \
          "target/Saxon-HE-accuracy-$version-release-check.html"
